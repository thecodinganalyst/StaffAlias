spring:
  application:
    name: staffalias
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

staffalias:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend-url: ${STAFFALIAS_FRONTEND_URL:http://localhost:5173}
  email:
    from: ${RESEND_FROM:}
    resend:
      api-key: ${RESEND_API_KEY:}
  platform-admin:
    username: ${PLATFORM_ADMIN_USERNAME:}
    password: ${PLATFORM_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
