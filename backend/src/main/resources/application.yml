spring:
  application:
    name: staffalias
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

staffalias:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
