name: Deploy Frontend to Firebase Hosting

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  test-build-deploy:
    name: Test, build and deploy frontend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Restore npm download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Lint frontend
        working-directory: frontend
        env:
          VITE_API_URL: /
          VITE_APP_NAME: StaffAlias
        run: npm run lint

      - name: Type check frontend
        working-directory: frontend
        env:
          VITE_API_URL: /
          VITE_APP_NAME: StaffAlias
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        env:
          VITE_API_URL: /
          VITE_APP_NAME: StaffAlias
        run: npm run test

      - name: Build production frontend
        working-directory: frontend
        env:
          VITE_API_URL: /
          VITE_APP_NAME: StaffAlias
        run: npm run build

      - name: Validate Firebase Hosting site
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
        run: |
          test -n "${FIREBASE_HOSTING_SITE}"
          npx --yes firebase-tools@15.30.0 hosting:sites:get "${FIREBASE_HOSTING_SITE}" \
            --project "${PROJECT_ID}" \
            --non-interactive

      - name: Select production Hosting site
        env:
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'firebase.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.hosting.site = process.env.FIREBASE_HOSTING_SITE;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Deploy to Firebase Hosting
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          npx --yes firebase-tools@15.30.0 deploy \
            --only hosting \
            --project "${PROJECT_ID}" \
            --non-interactive \
            --message "GitHub ${GITHUB_SHA}"

      - name: Verify deployed frontend
        env:
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
        run: |
          FRONTEND_URL="https://${FIREBASE_HOSTING_SITE}.web.app"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 "${FRONTEND_URL}" > /dev/null; then
              echo "Frontend available at ${FRONTEND_URL}"
              exit 0
            fi
            echo "Frontend check attempt ${attempt}/12 failed; retrying..."
            sleep 10
          done
          echo "Firebase Hosting did not become reachable."
          exit 1

      - name: Verify same-origin API proxy\n        env:\n          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}\n        run: |\n          FRONTEND_URL=\"https://${FIREBASE_HOSTING_SITE}.web.app\"\n          for attempt in {1..12}; do\n            if curl --fail --silent --show-error --max-time 20 \"${FRONTEND_URL}/actuator/health\" > /dev/null; then\n              echo \"Same-origin backend proxy is reachable at ${FRONTEND_URL}/api\"\n              exit 0\n            fi\n            # Firebase rewrite only proxies /api/**; use an authenticated endpoint and accept 401 as proof it reached Spring.\n            STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 \"${FRONTEND_URL}/api/auth/me\" || true)\n            if [ \"${STATUS}\" = \"401\" ] || [ \"${STATUS}\" = \"200\" ]; then\n              echo \"Same-origin API proxy is reachable (HTTP ${STATUS}).\"\n              exit 0\n            fi\n            echo \"Same-origin API check attempt ${attempt}/12 returned ${STATUS}; retrying...\"\n            sleep 10\n          done\n          echo \"Same-origin API proxy did not become reachable.\"\n          exit 1\n\n      - name: Deployment summary
        env:
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
        run: |
          {
            echo "### StaffAlias frontend deployment"
            echo "- Hosting URL: https://${FIREBASE_HOSTING_SITE}.web.app"
            echo "- Browser API: same-origin /api proxy to Cloud Run"
            echo "- Source commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
