name: Terraform

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches:
      - main
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type apply to run terraform apply against production'
        required: true
        default: 'plan'

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.13.2'

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

  plan:
    name: Production plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_TERRAFORM_STATE_BUCKET != ''
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infrastructure/terraform

    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
      TERRAFORM_SERVICE_ACCOUNT: staffalias-terraform@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.13.2'

      - name: Initialize remote backend
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Plan production changes
        run: terraform plan -input=false -no-color

  apply:
    name: Production apply
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'apply'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infrastructure/terraform

    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
      TERRAFORM_SERVICE_ACCOUNT: staffalias-terraform@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require remote state bucket
        run: test -n "${TF_STATE_BUCKET}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.13.2'

      - name: Initialize remote backend
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Create reviewed plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply reviewed plan
        run: terraform apply -input=false -auto-approve tfplan
