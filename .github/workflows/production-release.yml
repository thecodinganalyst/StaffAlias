name: Production Release

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-backend.yml'
      - '.github/workflows/deploy-frontend.yml'
      - '.github/workflows/production-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  ci:
    name: Required CI checks
    uses: ./.github/workflows/ci.yml

  backend:
    name: Deploy backend
    needs: ci
    uses: ./.github/workflows/deploy-backend.yml

  frontend:
    name: Deploy frontend
    needs: backend
    uses: ./.github/workflows/deploy-frontend.yml

  verify:
    name: Verify production release
    needs: frontend
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve deployed release
        id: release
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
        run: |
          BACKEND_URL="$(gcloud run services describe "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.latestReadyRevisionName)')"
          FRONTEND_URL="https://${FIREBASE_HOSTING_SITE}.web.app"
          test -n "${BACKEND_URL}"
          test -n "${REVISION}"
          test -n "${FIREBASE_HOSTING_SITE}"
          echo "backend_url=${BACKEND_URL}" >> "$GITHUB_OUTPUT"
          echo "frontend_url=${FRONTEND_URL}" >> "$GITHUB_OUTPUT"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Verify backend health
        env:
          URL: ${{ steps.release.outputs.backend_url }}/actuator/health
        run: |
          for attempt in {1..12}; do
            status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' --max-time 20 "${URL}" || true)"
            if [ "${status}" = "200" ] && grep -q '"status":"UP"' response.json; then
              cat response.json
              exit 0
            fi
            if [ "${status}" = "401" ] || [ "${status}" = "403" ]; then
              echo "::error::Backend health returned non-retryable HTTP ${status}"
              cat response.json || true
              exit 1
            fi
            echo "Backend health attempt ${attempt}/12 returned HTTP ${status}; retrying..."
            sleep 5
          done
          echo "::error::Backend health did not become healthy."
          cat response.json || true
          exit 1

      - name: Verify frontend availability
        env:
          URL: ${{ steps.release.outputs.frontend_url }}
        run: curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 20 "${URL}" > /dev/null

      - name: Verify same-origin database readiness
        env:
          URL: ${{ steps.release.outputs.frontend_url }}/api/system/database-readiness
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          for attempt in {1..12}; do
            status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' --max-time 20 "${URL}" || true)"
            if [ "${status}" = "200" ] && grep -q '"status":"UP"' response.json; then
              cat response.json
              exit 0
            fi
            if [ "${status}" = "401" ] || [ "${status}" = "403" ] || [[ "${status}" =~ ^4[0-9][0-9]$ ]]; then
              echo "::error::Same-origin database readiness returned non-retryable HTTP ${status}"
              cat response.json || true
              gcloud run services logs read "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --limit 30 || true
              exit 1
            fi
            echo "Database readiness attempt ${attempt}/12 returned HTTP ${status}; retrying transient failure..."
            sleep 5
          done
          echo "::error::Database readiness did not become healthy for revision ${REVISION}."
          cat response.json || true
          gcloud run services logs read "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --limit 30 || true
          exit 1

      - name: Verify same-origin authenticated session
        env:
          FRONTEND_URL: ${{ steps.release.outputs.frontend_url }}
          USERNAME: ${{ vars.PLATFORM_ADMIN_USERNAME }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          test -n "${USERNAME}"
          PASSWORD="$(gcloud secrets versions access latest --secret=staffalias-platform-admin-password --project "${PROJECT_ID}")"
          trap 'rm -f cookies.txt login.json me.json' EXIT
          payload="$(jq -nc --arg username "${USERNAME}" --arg password "${PASSWORD}" '{username:$username,password:$password}')"
          login_status="$(curl --silent --show-error --output login.json --write-out '%{http_code}' --max-time 20 \
            --cookie-jar cookies.txt -H 'Content-Type: application/json' -d "${payload}" "${FRONTEND_URL}/api/auth/login" || true)"
          unset PASSWORD payload
          if [ "${login_status}" != "200" ]; then
            echo "::error::Same-origin login failed with HTTP ${login_status}"
            cat login.json || true
            exit 1
          fi
          me_status="$(curl --silent --show-error --output me.json --write-out '%{http_code}' --max-time 20 \
            --cookie cookies.txt "${FRONTEND_URL}/api/auth/me" || true)"
          if [ "${me_status}" != "200" ]; then
            echo "::error::Authenticated follow-up request failed with HTTP ${me_status}"
            cat me.json || true
            exit 1
          fi
          jq -e '.role == "PLATFORM_ADMIN"' me.json > /dev/null
          echo "Same-origin Platform Admin session verified."

      - name: Release summary
        run: |
          {
            echo "### StaffAlias production release"
            echo "- Source commit: `${{ github.sha }}`"
            echo "- Cloud Run revision: `${{ steps.release.outputs.revision }}`"
            echo "- Backend: ${{ steps.release.outputs.backend_url }}"
            echo "- Frontend: ${{ steps.release.outputs.frontend_url }}"
            echo "- Same-origin API proxy: verified"
            echo "- Authenticated session: verified"
            echo "- Verification: passed"
          } >> "$GITHUB_STEP_SUMMARY"
