name: Production Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  ci:
    name: Required CI checks
    uses: ./.github/workflows/ci.yml

  backend:
    name: Deploy backend
    needs: ci
    uses: ./.github/workflows/deploy-backend.yml

  frontend:
    name: Deploy frontend
    needs: backend
    uses: ./.github/workflows/deploy-frontend.yml

  verify:
    name: Verify production release
    needs: frontend
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve deployed release
        id: release
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
        run: |
          BACKEND_URL="$(gcloud run services describe "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.latestReadyRevisionName)')"
          FRONTEND_URL="https://${FIREBASE_HOSTING_SITE}.web.app"
          test -n "${BACKEND_URL}"
          test -n "${REVISION}"
          test -n "${FIREBASE_HOSTING_SITE}"
          echo "backend_url=${BACKEND_URL}" >> "$GITHUB_OUTPUT"
          echo "frontend_url=${FRONTEND_URL}" >> "$GITHUB_OUTPUT"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Verify backend health
        env:
          URL: ${{ steps.release.outputs.backend_url }}/actuator/health
        run: |
          response="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 20 "${URL}")"
          echo "${response}"
          echo "${response}" | grep -q '"status":"UP"'

      - name: Verify database-backed API operation
        env:
          URL: ${{ steps.release.outputs.backend_url }}/api/system/database-readiness
        run: |
          response="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 20 "${URL}")"
          echo "${response}"
          echo "${response}" | grep -q '"status":"UP"'

      - name: Verify frontend availability
        env:
          URL: ${{ steps.release.outputs.frontend_url }}
        run: curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 20 "${URL}" > /dev/null

      - name: Verify frontend-to-backend connectivity policy
        env:
          API_URL: ${{ steps.release.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.release.outputs.frontend_url }}
        run: |
          headers="$(mktemp)"
          curl --fail --silent --show-error --max-time 20 \
            -X OPTIONS "${API_URL}/api/system/database-readiness" \
            -H "Origin: ${FRONTEND_URL}" \
            -H "Access-Control-Request-Method: GET" \
            -D "${headers}" \
            -o /dev/null
          grep -qi "^access-control-allow-origin: ${FRONTEND_URL}" "${headers}"
          rm -f "${headers}"

      - name: Release summary
        run: |
          {
            echo "### StaffAlias production release"
            echo "- Source commit: \`${{ github.sha }}\`"
            echo "- Cloud Run revision: \`${{ steps.release.outputs.revision }}\`"
            echo "- Backend: ${{ steps.release.outputs.backend_url }}"
            echo "- Frontend: ${{ steps.release.outputs.frontend_url }}"
            echo "- Verification: passed"
          } >> "$GITHUB_STEP_SUMMARY"
