name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  test-build-deploy:
    name: Test, build and deploy backend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        working-directory: backend
        run: mvn -B verify

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build backend image
        id: image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
          GIT_SHA: ${{ github.sha }}
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/backend:${GIT_SHA}"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          docker build --pull --tag "${IMAGE_URI}" backend

      - name: Push backend image
        run: docker push "${{ steps.image.outputs.uri }}"

      - name: Deploy immutable image to Cloud Run
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${IMAGE_URI}" \
            --platform managed \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --min 0 \
            --max 3 \
            --concurrency 80 \
            --timeout 300 \
            --set-env-vars SPRING_PROFILES_ACTIVE=prod \
            --update-secrets DB_URL=staffalias-db-url:latest,DB_USERNAME=staffalias-db-username:latest,DB_PASSWORD=staffalias-db-password:latest \
            --quiet

      - name: Resolve deployed service URL and revision
        id: service
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
        run: |
          SERVICE_URL="$(gcloud run services describe "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.latestReadyRevisionName)')"
          test -n "${SERVICE_URL}"
          test -n "${REVISION}"
          echo "url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "Deployed revision: ${REVISION}"

      - name: Verify production health endpoint
        env:
          HEALTH_URL: ${{ steps.service.outputs.url }}/actuator/health
        run: |
          for attempt in {1..12}; do
            if response="$(curl --fail --silent --show-error --max-time 15 "${HEALTH_URL}")"; then
              echo "${response}"
              echo "${response}" | grep -q '"status":"UP"'
              exit 0
            fi
            echo "Health check attempt ${attempt}/12 failed; retrying..."
            sleep 10
          done
          echo "Cloud Run health check did not become healthy."
          exit 1

      - name: Deployment summary
        run: |
          {
            echo "### StaffAlias backend deployment"
            echo "- Image: \`${{ steps.image.outputs.uri }}\`"
            echo "- Revision: \`${{ steps.service.outputs.revision }}\`"
            echo "- URL: ${{ steps.service.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
